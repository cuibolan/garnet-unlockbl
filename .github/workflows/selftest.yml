name: selftest

on:
  push:
  pull_request:

jobs:
  test:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # setup-python 的 x64 Linux 构建目前覆盖到 24.04，没有 26.04（ubuntu-latest 已是 26.04），
        # 所以 3.9 固定在 24.04 上跑，用来守住 README 里「3.8+ 可用」的下限。
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.11"
            os: ubuntu-latest
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 自测（仅标准库，无第三方依赖）
        run: python tests/selftest.py

      - name: 演示模式（确认报告能正常生成）
        run: |
          python analyze_abl.py --demo
          python analyze_abl.py --demo elf
